# PolkAudit — Cloud Build: backend API → Cloud Run
#
# Same as cloudbuild.yaml. Kept for existing Cloud Build triggers that reference
# this filename. Indexer is external; dashboard UI is apps/frontend on Vercel.
#
# Prerequisites: see docs/GCP_CLOUD_BUILD.md

substitutions:
  _REGION: us-central1
  _AR_REPO: apps
  _BACKEND_IMAGE: polkaudit-backend
  _BACKEND_SERVICE: polkaudit-backend

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_IMAGE}:${SHORT_SHA}

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_IMAGE}:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_IMAGE}:latest
      - -f
      - apps/backend/Dockerfile
      - apps/backend

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_IMAGE}
    waitFor: [build-backend]

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_BACKEND_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      - --set-secrets=DATABASE_URL=polkaudit-database-url:latest,API_KEY=polkaudit-api-key:latest
      - --set-env-vars=LOG_LEVEL=INFO
    waitFor: [push-backend]

  - id: summary
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        echo "=== PolkAudit backend deployed ==="
        URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo "n/a")
        echo "  ${_BACKEND_SERVICE}: $${URL}"
        echo "  Point apps/frontend (Vercel) at: $${URL}/api/v1"
    waitFor: [deploy-backend]
